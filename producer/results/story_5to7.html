<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pip and the Helper School</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#1A1A2E;color:#FFF8E6;font:17px/1.6 system-ui,sans-serif;
 height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#art{flex:1;display:grid;place-items:center;padding:14px;min-height:0;position:relative}
#art img,#art svg{max-width:100%;max-height:100%;border-radius:18px;
 transition:transform .35s ease,filter .35s ease}
#art.tapped img,#art.tapped svg{transform:scale(1.04) rotate(-1deg);filter:brightness(1.12)}
#hint{position:absolute;bottom:10px;font-size:12px;color:#FFD23F;opacity:.75}
#text{padding:18px 22px 10px;min-height:28vh;font-size:19px}
#text .w{transition:color .12s}
#text .on{color:#FFD23F}
#bar{display:flex;align-items:center;gap:14px;padding:12px 20px 26px}
button{background:#6C8BEF;color:#FFF8E6;border:0;border-radius:999px;
 padding:11px 22px;font:inherit;font-size:16px}
button:disabled{opacity:.3}
#dots{flex:1;display:flex;gap:5px;justify-content:center}
#dots i{width:7px;height:7px;border-radius:50%;background:#FFF8E6;opacity:.25}
#dots i.now{opacity:1;background:#FFD23F}
#slot{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.4}
</style></head><body>
<div id="art"><div id="hint" hidden>tap the picture</div></div>
<div id="slot"></div>
<div id="text"></div>
<div id="bar">
  <button id="prev">Back</button>
  <div id="dots"></div>
  <button id="next">Next</button>
</div>
<script>
const PAGES = [{"page": 1, "slot": "cover", "tone": "warm", "text": "Pip and the Helper School.", "tags": ["imagine"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 2, "slot": "character", "tone": "calm", "text": "Pip is a little robot owl. Pip reads the news at night.", "tags": ["imagine", "imagine"], "img": null, "audio": null, "words": null, "tap": true}, {"page": 3, "slot": "news_discovery", "tone": "curious", "text": "A school and a company made a plan. They help new workers learn to use AI tools.", "tags": ["true", "true"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 4, "slot": "exploration", "tone": "curious", "text": "New workers learn from older workers. Pip peeks in the window.", "tags": ["true", "imagine"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 5, "slot": "challenge", "tone": "quiet", "text": "One new worker learned little about AI in school. Pip feels lost with new tools too.", "tags": ["true", "imagine"], "img": null, "audio": null, "words": null, "tap": true}, {"page": 6, "slot": "turning_point", "tone": "warm", "text": "A leader said new workers are still needed.", "tags": ["true"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 7, "slot": "resolution", "tone": "excited", "text": "Now they take classes and get a helper. Pip claps her wings.", "tags": ["true", "imagine"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 8, "slot": "reflection", "tone": "calm", "text": "Learning is for everyone. Maybe you will learn AI tools one day too.", "tags": ["explain", "maybe"], "img": null, "audio": null, "words": null, "tap": true}, {"page": 9, "slot": "real_world_facts", "tone": "calm", "text": "Carnegie Mellon and Microsoft made a program. New workers get help from workers who know more.", "tags": ["true", "true"], "img": null, "audio": null, "words": null, "tap": false}, {"page": 10, "slot": "quiz", "tone": "excited", "text": "Quiz time! Let's see what you remember.", "tags": ["imagine"], "img": null, "audio": null, "words": null, "tap": false}];
const PLACEHOLDER = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="400" fill="#121A33"/><circle cx="200" cy="185" r="78" fill="#6C8BEF"/><ellipse cx="200" cy="215" rx="46" ry="52" fill="#FFF8E6"/><circle cx="174" cy="170" r="21" fill="#FFD23F"/><circle cx="226" cy="170" r="21" fill="#FFD23F"/><path d="M186 196 L200 210 L214 196 Z" fill="#F7A23B"/><line x1="200" y1="107" x2="200" y2="82" stroke="#6C8BEF" stroke-width="7"/><circle cx="200" cy="76" r="9" fill="#FFD23F"/><text x="200" y="330" fill="#6C8BEF" font-family="system-ui" font-size="17" text-anchor="middle">placeholder</text></svg>`;
let i = 0, audio = null, raf = 0;

const art = document.getElementById('art'), hint = document.getElementById('hint');
const textEl = document.getElementById('text'), slotEl = document.getElementById('slot');
const dots = document.getElementById('dots');

PAGES.forEach(() => dots.insertAdjacentHTML('beforeend', '<i></i>'));

function render(n) {
  i = Math.max(0, Math.min(PAGES.length - 1, n));
  const p = PAGES[i];
  if (audio) { audio.pause(); audio = null; }
  cancelAnimationFrame(raf);

  art.className = '';
  art.innerHTML = (p.img ? `<img src="${p.img}" alt="">` : PLACEHOLDER);
  art.appendChild(hint);
  hint.hidden = !p.tap;

  slotEl.textContent = p.slot.replace(/_/g, ' ') + ' · ' + p.tone;

  // Word spans so narration can highlight. Falls back to plain text.
  textEl.innerHTML = p.text.split(/(\s+)/).map(t =>
    t.trim() ? `<span class="w">${t}</span>` : t).join('');

  document.querySelectorAll('#dots i').forEach((d, k) =>
    d.classList.toggle('now', k === i));
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === PAGES.length - 1;

  if (p.audio) {
    audio = new Audio(p.audio);
    audio.play().catch(() => {});       // iOS needs a gesture; silent is fine
    if (p.words) highlight(p.words);
  }
}

function highlight(words) {
  const spans = [...textEl.querySelectorAll('.w')];
  const step = () => {
    if (!audio) return;
    const t = audio.currentTime;
    spans.forEach((s, k) => {
      const w = words[k];
      s.classList.toggle('on', !!w && t >= w.start && t <= w.end);
    });
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

art.addEventListener('click', () => {
  if (!PAGES[i].tap) return;
  art.classList.add('tapped');
  setTimeout(() => art.classList.remove('tapped'), 380);
});
document.getElementById('next').onclick = () => render(i + 1);
document.getElementById('prev').onclick = () => render(i - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') render(i + 1);
  if (e.key === 'ArrowLeft') render(i - 1);
});
render(0);
</script></body></html>
